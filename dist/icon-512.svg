<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1928" />
      <stop offset="100%" stop-color="#042017" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />

  <!-- Outer Geometric Balance Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Glow effect backing -->
  <g filter="url(#glow)" opacity="0.4">
    <circle cx="256" cy="140" r="18" fill="#34d399" />
    <path d="M120 200 H392" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <path d="M256 140 V390" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Central Pivot & Mast -->
  <circle cx="256" cy="140" r="16" fill="url(#goldGrad)" />
  <circle cx="256" cy="140" r="7" fill="#090d16" />
  <line x1="256" y1="156" x2="256" y2="390" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M200 390 H312" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Horizontal Beam (The Mizan Balance Bar) -->
  <line x1="110" y1="200" x2="402" y2="200" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Left Scale Pan & Cords -->
  <line x1="130" y1="200" x2="90" y2="280" stroke="#34d399" stroke-width="4" stroke-opacity="0.8" />
  <line x1="130" y1="200" x2="170" y2="280" stroke="#34d399" stroke-width="4" stroke-opacity="0.8" />
  <path d="M70 280 Q130 325 190 280 Z" fill="url(#emeraldGrad)" fill-opacity="0.25" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linejoin="round" />

  <!-- Right Scale Pan & Cords -->
  <line x1="382" y1="200" x2="342" y2="280" stroke="#34d399" stroke-width="4" stroke-opacity="0.8" />
  <line x1="382" y1="200" x2="422" y2="280" stroke="#34d399" stroke-width="4" stroke-opacity="0.8" />
  <path d="M322 280 Q382 325 442 280 Z" fill="url(#emeraldGrad)" fill-opacity="0.25" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linejoin="round" />

  <!-- Center Diamond Emblem (Mizan / Balance Symbol) -->
  <polygon points="256,180 274,200 256,220 238,200" fill="url(#goldGrad)" />
</svg>
