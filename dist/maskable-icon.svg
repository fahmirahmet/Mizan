<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="maskBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1928" />
      <stop offset="100%" stop-color="#042017" />
    </linearGradient>
    <linearGradient id="emeraldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#maskBgGrad)" />

  <!-- Inner Safe Zone Graphics (scaled to fit within 75% safe area) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Outer Geometric Balance Accent Ring -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Central Pivot & Mast -->
    <circle cx="256" cy="140" r="16" fill="url(#goldGradMask)" />
    <circle cx="256" cy="140" r="7" fill="#090d16" />
    <line x1="256" y1="156" x2="256" y2="390" stroke="url(#emeraldGradMask)" stroke-width="12" stroke-linecap="round" />
    <path d="M190 390 H322" stroke="url(#emeraldGradMask)" stroke-width="12" stroke-linecap="round" />

    <!-- Horizontal Beam -->
    <line x1="100" y1="200" x2="412" y2="200" stroke="url(#goldGradMask)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Scale Pan & Cords -->
    <line x1="120" y1="200" x2="80" y2="280" stroke="#34d399" stroke-width="5" stroke-opacity="0.9" />
    <line x1="120" y1="200" x2="160" y2="280" stroke="#34d399" stroke-width="5" stroke-opacity="0.9" />
    <path d="M60 280 Q120 325 180 280 Z" fill="url(#emeraldGradMask)" fill-opacity="0.35" stroke="url(#emeraldGradMask)" stroke-width="6" stroke-linejoin="round" />

    <!-- Right Scale Pan & Cords -->
    <line x1="392" y1="200" x2="352" y2="280" stroke="#34d399" stroke-width="5" stroke-opacity="0.9" />
    <line x1="392" y1="200" x2="432" y2="280" stroke="#34d399" stroke-width="5" stroke-opacity="0.9" />
    <path d="M332 280 Q392 325 452 280 Z" fill="url(#emeraldGradMask)" fill-opacity="0.35" stroke="url(#emeraldGradMask)" stroke-width="6" stroke-linejoin="round" />

    <!-- Center Diamond Emblem -->
    <polygon points="256,176 278,200 256,224 234,200" fill="url(#goldGradMask)" />
  </g>
</svg>
